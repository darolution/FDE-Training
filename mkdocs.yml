site_name: FDE Training
site_description: A free, build-first course from first line of code to Forward Deployed Engineer skills with Claude.
site_url: https://darolution.github.io/FDE-Training/
repo_url: https://github.com/darolution/FDE-Training
repo_name: darolution/FDE-Training
edit_uri: edit/main/docs/
copyright: Lesson text CC BY 4.0 · Code MIT · Independent course, not affiliated with or endorsed by Anthropic or any company named.

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.mark

plugins:
  - search

nav:
  - Start:
      - index.md
      - Syllabus: syllabus.md
      - Course rules: rules.md
      - Costs: costs.md
      - Glossary: glossary.md
      - Progress log: progress.md
  - Setup:
      - setup/index.md
      - Your own copy (optional): setup/your-own-copy.md
      - "Splunk lab (security track)": setup/splunk-lab.md
  - Launchpad:
      - launchpad/index.md
      - "L1 · Your computer as a workshop": launchpad/l1-terminal.md
      - "L2 · Python 1: values and variables": launchpad/l2-python-basics.md
      - "L3 · Python 2: lists, loops, functions": launchpad/l3-python-data.md
      - "L4 · Python 3: files, JSON, errors": launchpad/l4-python-files.md
      - "L5 · Git and GitHub": launchpad/l5-git.md
      - "L6 · The web and APIs": launchpad/l6-apis.md
      - "L7 · Working with AI tools": launchpad/l7-ai-tools.md
      - "L8 · Launchpad project": launchpad/l8-project.md
  - "Phase 1":
      - phase-1/index.md
      - "Week 1 · Claude API essentials": phase-1/week-01.md
      - "Week 2 · Prompting for real work": phase-1/week-02.md
      - "Week 3 · Evals": phase-1/week-03.md
      - "Week 4 · Capstone: Claims intake": phase-1/week-04-capstone.md
  - "Phases 2–5":
      - "Phase 2 · Production": phase-2/index.md
      - "Phase 3 · Agents and MCP": phase-3/index.md
      - "Phase 4 · Architecture": phase-4/index.md
      - "Phase 5 · Residency sim": phase-5/index.md
  - Reference:
      - "Models and pricing": reference/models.md
      - "The FDE role": reference/fde-role.md
      - "Handover template": reference/handover-template.md
