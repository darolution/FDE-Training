[pytest]
testpaths = labs
# Two kinds of tests are skipped in a normal run (and in CI's main test step):
#   capstone - specification tests for capstone code you write yourself:  python -m pytest -m capstone
#   exercise - Launchpad exercise checks:  python labs/launchpad/check.py l3
addopts = -m "not capstone and not exercise" -q
markers =
    capstone: specification tests for capstone code you write yourself
    exercise: Launchpad exercise checks (run with labs/launchpad/check.py)
